<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JustType — 繁體中文打字練習</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/favicon.png" />
<meta name="theme-color" content="#2563eb" />
<meta name="description" content="繁體中文打字練習：單字、句子、小短文、文言文。" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">打</span>
    <div class="brand-title">JustType</div>
  </div>
  <div class="topbar-actions">
    <button id="themeToggleBtn" class="btn ghost small theme-btn" type="button" aria-label="切換深淺色主題" title="切換深淺色主題">
      <span id="themeIcon">☀️</span> <span id="themeText">淺色</span>
    </button>
    <label class="font-size-label" for="fontSizeSelect">字體大小</label>
    <select id="fontSizeSelect" aria-label="字體大小">
      <option value="sm">小</option>
      <option value="md" selected>中</option>
      <option value="lg">大</option>
    </select>
    <button id="statsBtn" class="btn ghost small" type="button" aria-label="查看練習紀錄與成效統計">成績統計</button>
    <button id="resetStatsBtn" class="btn ghost small" type="button">清除紀錄</button>
  </div>
</header>

<main id="homeView" class="container">
  <section class="hero">
    <h1>選一種練習，直接開始打</h1>
    <p class="hero-sub"><strong>單字</strong>、<strong>句子</strong>、<strong>小短文</strong>、<strong>長文章</strong>、<strong>生活情境題</strong>、<strong>中英雜燴</strong>、<strong>文言文</strong>、<strong>一般法律公文</strong>、<strong>訴訟法律公文</strong></p>
  </section>

  <section class="carousel-shell" aria-label="練習模式">
    <div id="carouselViewport" class="carousel-viewport">
      <div class="carousel-light" aria-hidden="true"></div>
      <div id="modeGrid" class="mode-carousel"></div>
    </div>
    <div class="carousel-nav">
      <button id="carouselPrev" class="btn small" type="button" aria-label="上一個模式">‹</button>
      <div id="carouselDots" class="carousel-dots" aria-label="選擇模式"></div>
      <button id="carouselNext" class="btn small" type="button" aria-label="下一個模式">›</button>
    </div>
  </section>

  <footer class="footer">JustType · <a class="footer-github" href="https://github.com/Xavier05273/JustType" target="_blank" rel="noopener noreferrer" title="前往 GitHub 專案"><svg class="footer-github-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>Github</a></footer>
</main>

<main id="practiceView" class="container hidden">
  <div class="practice-head">
    <button id="backHomeBtn" class="btn ghost" type="button">← 回首頁</button>
    <div class="practice-title" id="practiceTitle">練習</div>
    <div class="hud">
      <span class="hud-item">時間 <strong id="hudTime">00:00</strong></span>
      <span class="hud-item">速度 <strong id="hudWpm">0</strong> 字/分</span>
      <span class="hud-item">正確率 <strong id="hudAcc">100%</strong></span>
    </div>
  </div>

  <div class="progress-track" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>

  <div class="cangjie-bar">
    <div id="cangjieHint" class="cangjie-hint" aria-live="polite" title="目前要打的字之拆字（倉頡／嘸蝦米／速成三方塊橫向反向環滾輪，拖曳/滾輪/箭頭切換；組字時凍結）">拆字：—</div>
  </div>
  <div id="targetBox" class="target-box" tabindex="0" aria-label="目標文字，點一下聚焦輸入框"></div>
  <div id="inputBox" class="input-box"></div>
  <p id="hintLine" class="hint-line" aria-live="polite"></p>

  <div class="practice-foot">
    <button id="restartBtn" class="btn" type="button">換一題</button>
    <label class="auto-advance-label" id="endlessLabel" for="endlessCheck" title="開啟後不結算，持續自動跳下一題">
      <input type="checkbox" id="endlessCheck" />
      <span>無盡模式</span>
    </label>
    <label class="auto-advance-label" for="onKeyboardCheck" title="在輸入框下方顯示鍵位提示">
      <input type="checkbox" id="onKeyboardCheck" />
      <span>鍵位提示</span>
    </label>
    <label class="auto-advance-label" for="layoutSelect" id="layoutLabel">
      <select id="layoutSelect" aria-label="鍵盤版面">
        <option value="bopomofo" selected>注音</option>
        <option value="cangjie">倉頡</option>
        <option value="boshiamy">嘸蝦米</option>
        <option value="sucheng">速成</option>
      </select>
    </label>
  </div>

  <section id="onKeyboardWrap" class="on-kb-wrap hidden" aria-label="鍵位提示">
    <div id="onKeyboard" class="on-kb"></div>
  </section>
</main>

<div id="resultOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
  <div class="modal">
    <h2 id="resultTitle">本局完成</h2>
    <div id="resultGrid" class="result-grid"></div>
    <p id="anomalyLine" class="anomaly-line hidden"></p>
    <p id="newRecordLine" class="new-record hidden">★ 新紀錄！</p>
    <div class="modal-actions">
      <button id="againBtn" class="btn primary" type="button">再來一局</button>
      <button id="homeBtn" class="btn" type="button">回首頁</button>
    </div>
  </div>
</div>

<div id="statsOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
  <div class="modal stats-modal">
    <div class="stats-modal-head">
      <h2 id="statsTitle">練習統計與歷史紀錄</h2>
      <button id="closeStatsBtn" class="btn ghost small" type="button" aria-label="關閉統計視窗">✕</button>
    </div>
    <div id="statsOverview" class="stats-overview"></div>
    <div class="stats-section-title">各模式個人最佳</div>
    <div id="statsBestGrid" class="stats-best-grid"></div>
    <div class="stats-section-title">最近練習紀錄</div>
    <div id="statsHistWrap" class="stats-hist-wrap">
      <div id="statsHistList" class="stats-hist-list"></div>
    </div>
    <div class="modal-actions stats-modal-foot">
      <button id="closeStatsBtnBottom" class="btn primary" type="button">關閉</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
